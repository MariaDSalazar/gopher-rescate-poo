<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gopher al Rescate · Código QR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  html, body { margin: 0; height: 100%; }
  body { font-family: Poppins, system-ui, sans-serif; color: #fff; display: grid; place-items: center; text-align: center;
    background: radial-gradient(circle at 15% 0%, #0b3f93 0%, #002C71 45%, #001B47 100%); }
  h1 { font-size: clamp(1.8rem, 4vw, 3rem); margin: 0 0 .2em; }
  h1 b { color: #EAAA00; }
  p { margin: 0 0 1em; font-size: clamp(1rem, 2vw, 1.4rem); opacity: .9; }
  .qr { background: #fff; border-radius: 24px; padding: 18px; display: inline-block; box-shadow: 0 16px 40px rgba(0,0,0,.35); }
  .qr img { width: min(62vh, 80vw); height: auto; display: block; image-rendering: pixelated; }
  .url { font-weight: 600; color: #EAAA00; font-size: clamp(1rem, 2.2vw, 1.5rem); margin-top: 1em; word-break: break-all; }
  a { color: inherit; }
</style>
</head>
<body>
<div>
  <h1>Gopher al <b>Rescate</b></h1>
  <p>Escanea el código con la cámara de tu celular</p>
  <div class="qr"><img src="qr.png" alt="Código QR del juego Gopher al Rescate"></div>
  <div class="url"><a href="./">mariadsalazar.github.io/gopher-rescate-poo</a></div>
</div>
